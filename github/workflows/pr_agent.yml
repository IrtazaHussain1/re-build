name: Qodo Merge AI PR Agent

on:
  pull_request:
    branches:
      - main
      - develop
    types: [opened, reopened, ready_for_review]
  issue_comment:

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest

    # Set permissions for the GitHub token to interact with issues, PRs, and repo content
    permissions:
      issues: write
      pull-requests: write
      contents: write

    name: Run Qodo Merge AI on PRs and Comments

    steps:
      - name: Qodo Merge AI PR Agent Step
        id: pragent
        uses: qodo-ai/pr-agent@main
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
